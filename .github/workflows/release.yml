name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build outpost for e2e
        run: go build -o bin/outpost-e2e ./cmd/outpost

      - name: Prepare loopback SSH host
        run: bash scripts/e2e/setup-loopback-host.sh

      - name: Run e2e tests
        run: |
          if getent group docker >/dev/null 2>&1; then
            sg docker -c 'OUTPOST_E2E=1 OUTPOST_E2E_HOST_MODE=loopback go test -tags=e2e -timeout=45m -count=1 -p 1 -v ./e2e/...'
          else
            OUTPOST_E2E=1 OUTPOST_E2E_HOST_MODE=loopback go test -tags=e2e -timeout=45m -count=1 -p 1 -v ./e2e/...
          fi

  release:
    name: Build and publish
    runs-on: ubuntu-latest
    needs:
      - e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          binary="outpost"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            binary="outpost.exe"
          fi
          go build -trimpath \
            -ldflags="-s -w" \
            -o "dist/${binary}" \
            ./cmd/outpost
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            archive="outpost_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
            zip -q "${archive}" "${binary}"
          else
            archive="outpost_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
            tar -czf "${archive}" "${binary}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: outpost-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/outpost_*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum outpost_* > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
